[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-risk-agent"
version = "0.1.0"
description = "Scheduled Alpaca paper-trading agent whose risk layer sizes every trade and logs why."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
ui = ["gradio>=6", "pandas>=2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=risk_agent --cov-report=term-missing --cov-fail-under=80"
markers = ["binary: runs the real alpaca CLI binary (offline, --dry-run only)"]

[tool.coverage.run]
omit = ["src/risk_agent/ui.py"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "risk_agent.ui"
warn_return_any = false  # gradio/pandas constructors are typed as Any
